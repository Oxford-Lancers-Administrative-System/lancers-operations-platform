    <rect x="784" y="332" width="204" height="58" rx="8" fill="#E3EBF8" stroke="#1D42A6" stroke-width="1.5" />
    <text x="886" y="353" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Kit Distributed is</text>
