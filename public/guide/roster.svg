    <polygon points="429,20 442,27 429,34 416,27" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="448" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Decision</text>
    <polygon points="551.12,20 574,20 570.88,34 548,34" fill="#E2C044" stroke="#8D7149" stroke-width="1.5" />
    <text x="580" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Message sent</text>
    <rect x="680" y="20" width="26" height="14" rx="7" fill="#ECEAE6" stroke="#5A5754" stroke-width="1.5" />
    <text x="712" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">End</text>
  </g>
  <g>
    <polyline points="246,134 246,183 566,183 566,204" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="566,134 566,204" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="566" y="169" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Automatic</text>
    <polyline points="886,134 886,183 566,183 566,204" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="566,262 566,332" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="668,361 784,361" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="726" y="361" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Automatic</text>
    <polyline points="566,390 566,460" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="566" y="418" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Operator sets</text>
    <text x="566" y="432" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Active</text>
    <polyline points="566,518 566,567 246,567 246,588" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="144,617 82,617 82,489 464,489" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="273" y="482" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Either way,</text>
    <text x="273" y="496" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">any time</text>
    <polyline points="566,518 566,567 886,567 886,588" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="886,646 886,716" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>
