<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 932" width="884" height="932" role="img" aria-labelledby="diagram-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="diagram-title">How a person's record is corrected, merged, exported and erased</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5754" />
    </marker>
  </defs>
  <rect width="884" height="932" fill="#F6F5F2" />
  <g>
    <rect x="20" y="20" width="26" height="14" rx="3.5" fill="#FFFFFF" stroke="#002147" stroke-width="1.5" />
    <text x="52" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">State</text>
    <rect x="152" y="20" width="26" height="14" rx="3.5" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="184" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Operator acts</text>
    <rect x="284" y="20" width="26" height="14" rx="3.5" fill="#E3EBF8" stroke="#1D42A6" stroke-width="1.5" />
    <text x="316" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">App acts</text>
    <polygon points="429,20 442,27 429,34 416,27" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="448" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Decision</text>
    <polygon points="551.12,20 574,20 570.88,34 548,34" fill="#E2C044" stroke="#8D7149" stroke-width="1.5" />
    <text x="580" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Message sent</text>
    <rect x="680" y="20" width="26" height="14" rx="7" fill="#ECEAE6" stroke="#5A5754" stroke-width="1.5" />
    <text x="712" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">End</text>
  </g>
  <g>
    <polyline points="442,134 442,194" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="340,233 224,233" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="282" y="233" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Yes</text>
    <polyline points="442,272 442,322" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="442" y="297" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">No</text>
    <polyline points="340,361 224,361" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="282" y="361" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Yes</text>
    <polyline points="442,400 442,450" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="442" y="425" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">No</text>
    <polyline points="544,489 660,489" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="602" y="489" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">For a copy</text>
    <polyline points="442,528 442,588" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="442" y="558" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">To be removed</text>
    <polyline points="442,646 442,716" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="442,774 442,844" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="442" y="809" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Both recorded</text>
  </g>
  <g>
    <rect x="340" y="76" width="204" height="58" rx="8" fill="#FFFFFF" stroke="#002147" stroke-width="1.5" />
    <text x="442" y="105" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Person record</text>
    <polygon points="442,194 544,233 442,272 340,233" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="442" y="225" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Anything required</text>
    <text x="442" y="241" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">missing?</text>
    <rect x="20" y="204" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="122" y="225" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Correct it, or nudge</text>
    <text x="122" y="241" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">them for it</text>
    <polygon points="442,322 544,361 442,400 340,361" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="442" y="353" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Two records,</text>
    <text x="442" y="369" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">one person?</text>
    <rect x="20" y="332" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="122" y="353" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Merge, answering every</text>
    <text x="122" y="369" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">difference</text>
    <polygon points="442,450 544,489 442,528 340,489" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="442" y="489" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Have they asked?</text>
    <rect x="660" y="460" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="762" y="489" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Export everything held</text>
    <rect x="340" y="588" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="442" y="617" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">First confirmation</text>
    <rect x="340" y="716" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="442" y="737" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Second confirmation,</text>
    <text x="442" y="753" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">another person</text>
    <rect x="340" y="844" width="204" height="58" rx="29" fill="#ECEAE6" stroke="#5A5754" stroke-width="1.5" />
    <text x="442" y="865" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">A record with no</text>
    <text x="442" y="881" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">name on it</text>
  </g>
</svg>
