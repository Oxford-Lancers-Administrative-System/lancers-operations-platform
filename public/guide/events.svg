<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 932" width="884" height="932" role="img" aria-labelledby="diagram-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="diagram-title">How an event is approved, messaged and recorded</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A5754" />
    </marker>
  </defs>
  <rect width="884" height="932" fill="#F6F5F2" />
  <g>
    <rect x="20" y="20" width="26" height="14" rx="3.5" fill="#FFFFFF" stroke="#002147" stroke-width="1.5" />
    <text x="52" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">State</text>
    <rect x="152" y="20" width="26" height="14" rx="3.5" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="184" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Operator acts</text>
    <rect x="284" y="20" width="26" height="14" rx="3.5" fill="#E3EBF8" stroke="#1D42A6" stroke-width="1.5" />
    <text x="316" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">App acts</text>
    <polygon points="429,20 442,27 429,34 416,27" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="448" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Decision</text>
    <polygon points="551.12,20 574,20 570.88,34 548,34" fill="#E2C044" stroke="#8D7149" stroke-width="1.5" />
    <text x="580" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">Message sent</text>
    <rect x="680" y="20" width="26" height="14" rx="7" fill="#ECEAE6" stroke="#5A5754" stroke-width="1.5" />
    <text x="712" y="27" dominant-baseline="central" font-size="11" fill="#5A5754">End</text>
  </g>
  <g>
    <polyline points="122,134 122,194" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="224,233 340,233" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="282" y="226" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Something</text>
    <text x="282" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">missing</text>
    <polyline points="122,272 122,332" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="122" y="302" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Operator approves</text>
    <polyline points="224,361 660,361" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="762,390 762,460" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="762" y="425" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Automatic</text>
    <polyline points="122,390 122,460" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="122" y="425" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Automatic</text>
    <polyline points="122,518 122,588" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="122" y="546" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">On the</text>
    <text x="122" y="560" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">schedule</text>
    <polyline points="122,646 122,706" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="224,745 340,745" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="282" y="745" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">No</text>
    <polyline points="122,784 122,844" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="122" y="814" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#5A5754" stroke="#F6F5F2" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Yes</text>
    <polyline points="224,873 340,873" fill="none" stroke="#5A5754" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>
  <g>
    <rect x="20" y="76" width="204" height="58" rx="8" fill="#FFFFFF" stroke="#002147" stroke-width="1.5" />
    <text x="122" y="105" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Draft</text>
    <polygon points="122,194 224,233 122,272 20,233" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="122" y="225" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Date, time, name,</text>
    <text x="122" y="241" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">audience?</text>
    <rect x="340" y="204" width="204" height="58" rx="29" fill="#ECEAE6" stroke="#5A5754" stroke-width="1.5" />
    <text x="442" y="233" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Refused</text>
    <rect x="20" y="332" width="204" height="58" rx="8" fill="#FFFFFF" stroke="#002147" stroke-width="1.5" />
    <text x="122" y="361" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Approved</text>
    <rect x="660" y="332" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="762" y="353" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Amend, reschedule</text>
    <text x="762" y="369" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">or cancel</text>
    <rect x="660" y="460" width="204" height="58" rx="8" fill="#E3EBF8" stroke="#1D42A6" stroke-width="1.5" />
    <text x="762" y="473" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Unsent messages held,</text>
    <text x="762" y="489" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">then resumed</text>
    <text x="762" y="505" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">or cancelled</text>
    <polygon points="34,460 224,460 210,518 20,518" fill="#E2C044" stroke="#8D7149" stroke-width="1.5" />
    <text x="122" y="489" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Invitation</text>
    <polygon points="34,588 224,588 210,646 20,646" fill="#E2C044" stroke="#8D7149" stroke-width="1.5" />
    <text x="122" y="609" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Reminders, then the</text>
    <text x="122" y="625" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">email rung</text>
    <polygon points="122,706 224,745 122,784 20,745" fill="#F6F5F2" stroke="#C09723" stroke-width="1.5" />
    <text x="122" y="737" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Answered by the</text>
    <text x="122" y="753" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">deadline?</text>
    <polygon points="354,716 544,716 530,774 340,774" fill="#E2C044" stroke="#8D7149" stroke-width="1.5" />
    <text x="442" y="737" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Escalation to</text>
    <text x="442" y="753" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">the President</text>
    <rect x="20" y="844" width="204" height="58" rx="8" fill="#FFFFFF" stroke="#002147" stroke-width="1.5" />
    <text x="122" y="873" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#211D1C">Occurred</text>
    <rect x="340" y="844" width="204" height="58" rx="8" fill="#B9D6F2" stroke="#002147" stroke-width="1.5" />
    <text x="442" y="873" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#002147">Record attendance</text>
  </g>
</svg>
