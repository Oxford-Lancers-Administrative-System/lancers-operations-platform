# Dependency and action update alerts (LAN-352).
#
# Production dependencies carried a critical Next.js advisory for weeks without
# anyone noticing because nothing scanned them. Dependabot opens one grouped
# draft-style pull request per ecosystem per week; package.json and .github/**
# are prohibited paths in merge-rules.json, so every one of these is Brian's to
# merge by hand and none can auto-merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    labels: []
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    labels: []
