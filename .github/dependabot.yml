# Dependency and action update alerts (LAN-352, LAN-402).
#
# Scheduled version-update pull requests are switched off (Brian, 2026-09-21):
# every one is a hand merge, since package.json and .github/** are prohibited
# paths, and a weekly batch of four was more than the club can review. The
# entries stay so that Dependabot's security updates keep opening on their
# own; a version-update job with an open-pull-requests limit of zero opens
# no scheduled pull requests at all. LAN-402 decides whether a quarterly
# cadence can be expressed here; until then, dependency currency is a
# manual `npm outdated` pass Brian schedules.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: []
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: []
