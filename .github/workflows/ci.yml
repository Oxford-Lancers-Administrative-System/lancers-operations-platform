name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The required check "Format, lint, typecheck, test, build" is the `quality`
  # job at the bottom. It does no work itself: it passes only when all three
  # parts below succeeded, so a failure in any of format, lint, typecheck, unit
  # tests, database tests, gate or build still fails the check branch
  # protection requires (LAN-436). The parts carry no `name:`, deliberately —
  # every named job in this file is a required check, and
  # `.github/merge-rules.json` lists exactly those.

  # Needs no database, so it runs beside the Supabase job instead of after it.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # NEXT_PUBLIC_* values are inlined at build time. Placeholders on an
      # unroutable address (TEST-NET-1, RFC 5737), exactly as the container job
      # builds: the build must not need a database to succeed.
      NEXT_PUBLIC_SUPABASE_URL: http://192.0.2.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # The unit project needs no stack either — `vitest.setup.ts` refuses it a
  # database connection — so it runs on its own runner instead of competing
  # with the serialized database suites for one.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The same unroutable placeholder: the Data API guard in
      # `vitest.setup.ts` refuses this origin, and nothing reaches it.
      NEXT_PUBLIC_SUPABASE_URL: http://192.0.2.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  # Two runners, each with its own stack built the same way: the serialized
  # database project on one and the gate suites on the other, so the slow
  # showcase loader no longer waits behind every database suite (LAN-436).
  # Migrations from empty, RLS posture and type drift are proved on both.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        suite: [database, gate]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        # Every check runs against a local stack. The production project is never
        # reachable from CI, by design — see docs/adr/0001-local-supabase-only.md.
        #
        # Only the services the suites use are started (LAN-436). No test, seed
        # or migration touches Storage, Realtime, Edge Functions, image
        # transformation, Studio or the analytics pipeline (Logflare and
        # Vector). Auth, PostgREST, Kong, postgres-meta and Mailpit — which the
        # auth-recovery and invitation suites read — still start.
        run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector

      - name: Capture local Supabase credentials
        id: supabase
        run: |
          npx supabase status -o json > /tmp/supabase-status.json
          node -e '
            const s = require("/tmp/supabase-status.json");
            const out = [
              `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY ?? s.ANON_KEY}`,
              `SUPABASE_SECRET_KEY=${s.SECRET_KEY ?? s.SERVICE_ROLE_KEY}`,
              `SUPABASE_DB_URL=${s.DB_URL}`,
            ];
            require("fs").appendFileSync(process.env.GITHUB_ENV, out.join("\n") + "\n");
          '
          rm -f /tmp/supabase-status.json
        # These are ephemeral, locally generated credentials for a throwaway
        # container. They are not project secrets and never leave the runner.
        #
        # SUPABASE_DB_URL is read from the running stack rather than written
        # down, because scripts/lib/local-db.mjs no longer defaults to port
        # 54322. On a developer machine that port is the coordinator primary
        # slot, and every caller of that guard truncates or rewrites whatever
        # database it is handed, so guessing it meant rewriting whichever stack
        # somebody happened to be holding. A CI runner has no slots and no
        # leases, so the honest answer here is simply whichever database the
        # "Start local Supabase" step above actually created.

      - name: Verify migrations apply cleanly from empty
        run: npx supabase db reset --no-seed

      - name: Verify RLS posture of migrations
        run: npm run check:rls

      - name: Verify generated types match the schema (drift check)
        run: npm run types:check

      - name: Load the synthetic dataset
        # Proves the seed still loads against a database rebuilt from empty, and
        # gives the schema and seed-property tests something to assert against.
        # Synthetic only — see scripts/seed-local.mjs.
        # CI owns its throwaway runner stack directly; developer commands remain
        # fenced through the two-slot coordinator.
        run: npm run db:seed:ci

      - name: Provision the test user
        env:
          TEST_USER_EMAIL: ci.user@oxfordlancers.local
          TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD || 'CiLocalPassword123!' }}
        run: npm run db:seed-user:ci

      - name: Test database suites
        if: matrix.suite == 'database'
        env:
          # Turns "local Supabase not configured" from a silent skip into a failure.
          REQUIRE_SUPABASE_TESTS: "1"
          TEST_USER_EMAIL: ci.user@oxfordlancers.local
          TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD || 'CiLocalPassword123!' }}
        # The runner-local stack was created above and has no agent-session lease.
        # `test:ci` is the database project; the unit project is the `unit` job.
        run: npm run test:ci

      - name: Test gate suites
        if: matrix.suite == 'gate'
        env:
          REQUIRE_SUPABASE_TESTS: "1"
          TEST_USER_EMAIL: ci.user@oxfordlancers.local
          TEST_USER_PASSWORD: ${{ secrets.CI_TEST_USER_PASSWORD || 'CiLocalPassword123!' }}
        run: npm run test:gate:ci

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true

  quality:
    name: Format, lint, typecheck, test, build
    needs: [static, unit, tests]
    # Always runs, so a failed or cancelled part fails this check rather than
    # skipping it: branch protection treats a skipped required check as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every part to have succeeded
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        # Anything but `success` — failure, cancelled or skipped — fails.
        run: |
          echo "format, lint, typecheck, build: $STATIC_RESULT"
          echo "unit tests: $UNIT_RESULT"
          echo "migrations, types, database tests and gate suites: $TESTS_RESULT"
          [ "$STATIC_RESULT" = "success" ] && [ "$UNIT_RESULT" = "success" ] && [ "$TESTS_RESULT" = "success" ]

  # The agent-tooling suites (TOOLING_SUITES in vitest.config.ts). NOT a
  # required check, and it must never become one: on a pull request that
  # touches none of the paths below it finishes without running the suites,
  # and no product code path runs through them (LAN-436).
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Decide whether the change touches agent tooling
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(scripts/|\.claude/|\.github/|missions/|supabase/|tests/(mission-|intake-|finish-mission|telemetry-|visual-|local-review-account|local-supabase-coordinator|helpers/)|package(-lock)?\.json$|vitest\.(config|setup)\.ts$|docs/mission-harness\.md$)'
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No agent-tooling path changed; the tooling suites are not run."
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Test agent tooling
        if: steps.scope.outputs.run == 'true'
        run: npm run test:tooling

  container:
    name: Container builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: lancers-operations-platform:ci
          # NEXT_PUBLIC_* values are inlined by Next.js at build time, so the
          # image must be built with them or every rendered route 500s. These
          # placeholders point at TEST-NET-1 (RFC 5737), which is unroutable —
          # the point is to prove the image serves pages without reaching a
          # database, not to talk to one.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://192.0.2.1:54321
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves the app
        # The same probe Cloud Run uses, plus the public routes. If this fails the
        # deploy would fail too, so it fails here on the pull request instead.
        run: |
          set -euo pipefail
          docker run -d --name app -p 8080:8080 -e SUPABASE_SECRET_KEY=ci-placeholder \
            lancers-operations-platform:ci

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /tmp/health.json; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Health check never passed. Container logs:"
            docker logs app
            docker rm -f app
            exit 1
          fi

          cat /tmp/health.json; echo
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"commit":"${{ github.sha }}"' /tmp/health.json
          grep -q '"secretsLoaded":true' /tmp/health.json
          # The container is started with no DATABASE_URL, so the flag the deploy
          # gate reads must report false here. Asserting the false case is what
          # proves the flag reports presence rather than being hard-coded true.
          grep -q '"databaseConfigured":false' /tmp/health.json
          # With no configured database there is nothing to probe. The field is
          # still present so the deployed-revision gate cannot silently accept
          # an older response shape.
          grep -q '"schemaCompatible":false' /tmp/health.json

          check() {
            actual=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://localhost:8080$1")
            echo "$1 -> $actual (expected $2)"
            [ "$actual" = "$2" ]
          }
          check / 200
          check /login 200
          # Protected, and no session: must redirect rather than render.
          check /dashboard 307

          docker rm -f app
