name: Mission merge

# Merges qualifying standard application work from an approved mission, once
# the Mission Lead has satisfied the journal-side gate and every required
# check has passed at the exact head. Mission Harness v1 / docs/adr/0027.
#
# The design constraint inherited from the fast lane, and the one thing never
# to relax: THIS WORKFLOW RE-DERIVES EVERY SERVER-VERIFIABLE CONJUNCT FROM
# EVIDENCE. It reads the merge rules and the gate from the BASE branch —
# `main`, already reviewed and merged — and applies them to the pull request's
# real diff and real check runs. The `mission-merge` label is how a Mission
# Lead asks; the evidence is what answers.
#
# What this lane deliberately trusts, and why it is bounded: the review
# result, visual approval, and owner-question facts live in machine-local
# mission state the workflow cannot see, so the Lead publishes them as a
# structured receipt in the pull request body. The receipt is checked for
# coherence — its reviewed SHA must equal the current head, and a "nonvisual"
# claim is refused when the diff touches a visual surface — and every
# prohibited surface (schema, workflows, agent roles, scripts, auth and trust
# boundaries, this lane's own rules and proofs) is refused from the diff
# itself, whatever the receipt says. See docs/adr/0027 for the decision.
#
# The pull request's code is fetched as git objects and diffed. It is never
# checked out and never executed. `workflow_run`, `pull_request_target` and
# `workflow_dispatch` all run the default branch's copy of this file.
#
# No agent holds merge capability. `.claude/settings.json` still denies
# `gh pr merge` and `gh pr ready`, and tests/agent-harness.test.ts still
# proves it. Authority lives here, in a reviewable checked-in file.
#
# CONSEQUENCE, decided deliberately (Brian, 2026-08-18): a merge performed
# with GITHUB_TOKEN does not trigger downstream workflows, so a mission merge
# does NOT run deploy.yml. `main` moves ahead of production until Brian runs
# `gh workflow run deploy.yml` or merges something himself. The Mission
# Lead's hourly checkpoint reports that drift.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull-request number to re-evaluate."
        required: true
        type: string

concurrency:
  group: mission-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate and merge
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Narrowed from the repository default, which must itself allow write —
      # a workflow can only reduce GITHUB_TOKEN's permissions, never widen.
      contents: write # merge
      pull-requests: write # mark ready for review, comment, merge
      checks: read # read the required checks' conclusions
      actions: read # read the triggering CI run

    steps:
      - name: Check out the base branch
        uses: actions/checkout@v5
        with:
          # Deliberately the base branch and never the pull request's head.
          # The rules and the gate that decide this must be the reviewed,
          # merged ones. `fetch-depth: 0` so the merge base is computable.
          ref: main
          fetch-depth: 0

      - name: Resolve the pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pull_request }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) PR="$DISPATCH_PR" ;;
            pull_request_target) PR="$TARGET_PR" ;;
            workflow_run)
              PR=$(gh api "repos/$REPO/commits/$RUN_HEAD_SHA/pulls" \
                     --jq '[.[] | select(.state == "open")] | first | .number // empty')
              ;;
            *) PR="" ;;
          esac
          if [ -z "${PR:-}" ]; then
            echo "No open pull request to evaluate." >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Read the pull request and its checks
        if: steps.resolve.outputs.found == 'true'
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail

          # `mergeable` is computed asynchronously; UNKNOWN is a refusal, not
          # a reason to guess, so poll briefly and then let the gate decide.
          for _ in 1 2 3 4 5; do
            gh pr view "$PR" --repo "$REPO" \
              --json number,state,isDraft,isCrossRepository,baseRefName,headRefOid,mergeable,labels,title,body \
              > pr.json
            [ "$(jq -r .mergeable pr.json)" = "UNKNOWN" ] || break
            sleep 5
          done

          HEAD_SHA=$(jq -r .headRefOid pr.json)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # The pull request's objects, fetched but never checked out and
          # never executed. Only `git diff` reads them.
          git fetch --no-tags origin "pull/$PR/head:refs/mission/head"
          FETCHED=$(git rev-parse refs/mission/head)
          if [ "$FETCHED" != "$HEAD_SHA" ]; then
            echo "Head moved during evaluation ($FETCHED vs $HEAD_SHA); refusing." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

          BASE=$(git merge-base origin/main refs/mission/head)
          git diff --name-status "$BASE" refs/mission/head > files.txt

          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs' | jq -s 'add // []' > checks.json

      - name: Re-derive the gate from evidence
        if: steps.resolve.outputs.found == 'true' && steps.read.outputs.stale == 'false'
        id: gate
        run: |
          set -euo pipefail
          node scripts/mission/gate-cli.mjs --pr pr.json --files files.txt --checks checks.json

      - name: Report a refusal on the pull request
        if: steps.gate.outputs.merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          # Only worth saying when a Mission Lead asked for this lane. An
          # unlabelled pull request is simply a normal one.
          if jq -e '.labels[]?.name | select(. == "mission-merge")' pr.json > /dev/null; then
            {
              echo "**Mission merge: refused.** This pull request stays in the normal lane —"
              echo "it remains a draft, and Brian merges it."
              echo ""
              jq -r '.reasons[] | "- " + .' mission-merge-verdict.json
              echo ""
              echo "Every server-verifiable conjunct was recomputed from evidence; the label did not decide it."
              echo "See \`docs/mission-harness.md\`."
            } | gh pr comment "$PR" --repo "$REPO" --body-file -
          fi

      - name: Merge
        if: steps.gate.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.number }}
          HEAD_SHA: ${{ steps.read.outputs.head_sha }}
          PACKAGE: ${{ steps.gate.outputs.package }}
          ISSUE: ${{ steps.gate.outputs.issue }}
        run: |
          set -euo pipefail

          # Agents open drafts and are forbidden to un-draft. This workflow
          # does it, and only here — after the gate was recomputed from
          # evidence and every required check concluded success. The merge is
          # trapped and the draft restored on any failure, because no agent
          # can re-draft a pull request.
          gh pr ready "$PR" --repo "$REPO"

          # --match-head-commit refuses if the head moved since it was read.
          # No --admin, ever: branch protection stays the authoritative gate.
          if ! gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"; then
            echo "::error::Merge refused. Restoring the draft state."
            if ! gh pr ready "$PR" --repo "$REPO" --undo; then
              echo "::error::Could not restore the draft. PR #$PR is un-drafted and UNMERGED — a human must re-draft or close it."
            fi
            exit 1
          fi

          {
            echo "**Merged by the mission lane.**"
            echo ""
            echo "- Work package: \`$PACKAGE\`"
            echo "- Linear issue: $ISSUE"
            echo "- Merged commit: \`$HEAD_SHA\` (squashed)"
            echo "- Required checks: all green at that commit before the merge."
            echo ""
            echo "A GITHUB_TOKEN merge does not trigger downstream workflows, so \`deploy.yml\`"
            echo "did not run. \`main\` is ahead of production until Brian deploys:"
            echo "\`gh workflow run deploy.yml\`. The mission checkpoint reports this drift."
          } | gh pr comment "$PR" --repo "$REPO" --body-file -

      - name: Record the verdict
        if: always() && steps.resolve.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mission-merge-verdict
          path: mission-merge-verdict.json
          if-no-files-found: ignore
